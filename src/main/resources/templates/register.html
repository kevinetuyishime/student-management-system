<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Student Registration</h1>
    <p>Enter student information below.</p>

    <div class="success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/student/register}"
          th:object="${student}"
          method="post">

        <label>First Name</label>
        <input type="text" th:field="*{firstName}" required>
        <small class="error" th:errors="*{firstName}"></small>

        <label>Last Name</label>
        <input type="text" th:field="*{lastName}" required>
        <small class="error" th:errors="*{lastName}"></small>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>
        <small class="error" th:errors="*{email}"></small>

        <label>Age</label>
        <input type="number" th:field="*{age}" min="19" required>
        <small class="error" th:errors="*{age}"></small>

        <button type="submit">Register Student</button>

    </form>

    <a th:href="@{/student/all}">View All Students</a>

</div>

</body>
</html>
